<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a1a5e">
  <meta name="robots" content="noindex">
  <title>≽^•⩊•^≼</title>
  <link rel="icon" type="image/webp" href="gato.webp">
  <style>
    :root {
      --glass: rgba(30, 16, 74, 0.32);
      --ink: #1b1238;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      background: #2a1a5e;
      cursor: pointer;
      user-select: none;
    }

    /* Fondo: rayas arcoíris que avanzan, desenfocadas */
    .rainbow {
      position: fixed;
      inset: -40px;
      background: repeating-linear-gradient(
        180deg,
        #ff4d6d 0 12%, #ff9f1c 12% 24%, #ffe14d 24% 36%,
        #5be37d 36% 48%, #4cc9f0 48% 60%, #7b61ff 60% 72%, #2a1a5e 72% 100%
      );
      background-size: 100% 140vh;
      filter: blur(14px) saturate(1.15);
      animation: flow 9s linear infinite;
      transform: skewY(-8deg);
    }

    @keyframes flow {
      to { background-position: 0 140vh; }
    }

    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(3px 3px at 12% 18%, #fff 50%, transparent 51%),
        radial-gradient(3px 3px at 72% 28%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 35% 72%, #fff 50%, transparent 51%),
        radial-gradient(3px 3px at 88% 80%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 55% 12%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 20% 88%, #fff 50%, transparent 51%);
      background-size: 420px 420px;
      animation: twinkle 1.6s steps(2) infinite, drift 18s linear infinite;
      opacity: 0.8;
    }

    @keyframes twinkle { 50% { opacity: 0.35; } }
    @keyframes drift { to { background-position: -420px 0; } }

    /* Filas de gatitos arriba y abajo */
    .row {
      position: fixed;
      left: 0;
      width: 100%;
      height: 72px;
      background: url("gato-recorte.png") repeat-x;
      background-size: 46px 72px;
      animation: scroll 14s linear infinite;
      z-index: 3;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    }

    .row--top {
      top: 0;
      transform: rotate(180deg);
    }

    .row--bottom {
      bottom: 0;
    }

    @keyframes scroll {
      to { background-position: -460px 0; }
    }

    /* Gatos voladores */
    .flyer {
      position: fixed;
      z-index: 2;
      width: calc(var(--s, 70px) * 0.628);
      height: var(--s, 70px);
      background: url("gato-recorte.png") center / contain no-repeat;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    .flyer--float {
      animation: across var(--d, 12s) linear infinite, bob 1.2s ease-in-out infinite alternate;
    }

    @keyframes across {
      from { left: -120px; }
      to { left: calc(100% + 120px); }
    }

    @keyframes bob {
      from { translate: 0 -10px; rotate: -12deg; }
      to { translate: 0 10px; rotate: 12deg; }
    }

    .flyer--spin {
      animation: spin var(--d, 3s) linear infinite;
    }

    @keyframes spin { to { rotate: 360deg; } }

    .flyer--bounce {
      animation: bounce 0.9s cubic-bezier(.3, 0, .7, 1) infinite alternate;
    }

    @keyframes bounce {
      from { translate: 0 0; scale: 1 0.85; }
      to { translate: 0 -90px; scale: 0.95 1.05; }
    }

    .pop {
      position: fixed;
      z-index: 6;
      width: 44px;
      height: 70px;
      margin: -35px 0 0 -22px;
      background: url("gato-recorte.png") center / contain no-repeat;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      pointer-events: none;
      animation: pop 1.1s cubic-bezier(.2, .7, .3, 1) forwards;
    }

    @keyframes pop {
      0% { transform: scale(0.2) rotate(0); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(1.3) rotate(var(--r)); opacity: 0; }
    }

    /* Tarjeta central */
    .card {
      position: relative;
      z-index: 4;
      width: min(92vw, 640px);
      padding: 28px 28px 24px;
      border-radius: 18px;
      text-align: center;
      background: var(--glass);
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      cursor: default;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 20px);
      margin-bottom: 16px;
    }

    .title h1 {
      margin: 0;
      color: #ffffff;
      font-size: clamp(28px, 6vw, 46px);
      letter-spacing: -0.02em;
      text-shadow: 3px 3px 0 #ff4d6d, -3px -3px 0 #4cc9f0;
    }

    .face {
      width: clamp(64px, 15vw, 116px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: url("gato.webp") center / cover;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
      animation: tilt 1.4s ease-in-out infinite alternate;
    }

    .face + h1 + .face {
      animation-direction: alternate-reverse;
    }

    @keyframes tilt {
      from { rotate: -10deg; scale: 1; }
      to { rotate: 10deg; scale: 1.08; }
    }

    .card p {
      margin: 10px 0;
      color: #ffffff;
      font-size: clamp(15px, 2.4vw, 18px);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    .counter {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .actions a,
    .actions button {
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    }

    .actions button {
      background: #ffe14d;
    }

    .actions a:active,
    .actions button:active {
      translate: 0 2px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    :focus-visible {
      outline: 3px solid #ffe14d;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .flyer { display: none; }
    }
  </style>
</head>
<body>
  <div class="rainbow" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="row row--top" aria-hidden="true"></div>
  <div class="row row--bottom" aria-hidden="true"></div>
  <div id="flyers" aria-hidden="true"></div>

  <main class="card">
    <div class="title">
      <span class="face" role="img" aria-label="Gato mirando fijamente"></span>
      <h1>¡miau!</h1>
      <span class="face" role="img" aria-label="Gato mirando fijamente"></span>
    </div>
    <p>encontraste el easter egg, curioso humano.</p>
    <p>aquí no hay código ni proyectos, solo gatos. muchos gatos.</p>
    <p>toca en cualquier parte para soltar más gatitos ≽^•⩊•^≼</p>
    <p class="counter" aria-live="polite"><span id="count">0</span> gatos liberados</p>
    <div class="actions">
      <button type="button" id="music">♪ Música: apagada</button>
      <a href="../../">Volver al portafolio</a>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      // Título que va cambiando entre caritas de gato
      const titles = ["≽^•⩊•^≼", "(˵◝ ⩊ ◜˵)マ", "/ᐠ > ˕ <マ ₊˚⊹♡", "ฅ^•ﻌ•^ฅ"];
      let t = 0;
      setInterval(() => { document.title = titles[t++ % titles.length]; }, 500);

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Gatos que cruzan, giran y rebotan por la pantalla
      const layer = document.getElementById("flyers");
      const rand = (a, b) => a + Math.random() * (b - a);
      if (!reduce) {
        for (let i = 0; i < 7; i++) {
          const el = document.createElement("span");
          el.className = "flyer flyer--float";
          el.style.setProperty("--s", rand(80, 140) + "px");
          el.style.setProperty("--d", rand(8, 16) + "s");
          el.style.top = rand(12, 80) + "%";
          el.style.animationDelay = -rand(0, 16) + "s, " + -rand(0, 1) + "s";
          layer.appendChild(el);
        }
        [[6, 22], [86, 18], [10, 70], [84, 66]].forEach(([x, y], i) => {
          const el = document.createElement("span");
          el.className = "flyer " + (i % 2 ? "flyer--spin" : "flyer--bounce");
          el.style.setProperty("--s", rand(90, 130) + "px");
          el.style.setProperty("--d", rand(2, 4) + "s");
          el.style.left = x + "%";
          el.style.top = y + "%";
          layer.appendChild(el);
        });
      }

      // Al tocar, sale volando un gatito
      const count = document.getElementById("count");
      let released = 0;
      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".actions")) return;
        if (!userMuted) startMusic();
        released++;
        count.textContent = released;
        if (reduce) return;
        const pop = document.createElement("span");
        pop.className = "pop";
        pop.style.left = e.clientX + "px";
        pop.style.top = e.clientY + "px";
        pop.style.setProperty("--x", rand(-220, 220) + "px");
        pop.style.setProperty("--y", rand(-260, -80) + "px");
        pop.style.setProperty("--r", rand(-540, 540) + "deg");
        document.body.appendChild(pop);
        pop.addEventListener("animationend", () => pop.remove());
        meow();
      });

      // Música chiptune original generada en el navegador (no usa archivos de audio)
      let ctx = null;
      let master = null;
      let playing = false;
      let userMuted = false;
      let timer = null;
      let step = 0;
      const button = document.getElementById("music");
      const tempo = 0.16;
      const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
      const melody = [76, 79, 81, 79, 76, 74, 72, 74, 76, 0, 76, 79, 84, 83, 81, 79,
                      77, 81, 84, 81, 77, 76, 74, 76, 79, 0, 79, 76, 74, 72, 74, 0];
      const bass = [48, 48, 55, 55, 53, 53, 55, 55];

      function tone(freq, start, dur, type, gain) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(gain, start);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(g).connect(master);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      }

      function schedule() {
        const now = ctx.currentTime;
        for (let i = 0; i < 8; i++) {
          const when = now + i * tempo;
          const note = melody[step % melody.length];
          if (note) tone(N(note), when, tempo * 0.9, "square", 0.07);
          if (step % 4 === 0) tone(N(bass[(step / 4) % bass.length]), when, tempo * 3.6, "triangle", 0.16);
          if (step % 2 === 1) tone(N(96), when, 0.03, "square", 0.015);
          step++;
        }
      }

      function startMusic() {
        if (playing) return;
        try {
          ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
          master = master || ctx.createGain();
          master.gain.value = 0.6;
          master.connect(ctx.destination);
          ctx.resume();
        } catch (e) { return; }
        playing = true;
        schedule();
        timer = setInterval(schedule, tempo * 8 * 1000);
        button.textContent = "♪ Música: encendida";
      }

      function stopMusic() {
        playing = false;
        clearInterval(timer);
        if (ctx) ctx.suspend();
        button.textContent = "♪ Música: apagada";
      }

      function meow() {
        if (!ctx || !playing) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        const t0 = ctx.currentTime;
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(700, t0);
        osc.frequency.linearRampToValueAtTime(1100, t0 + 0.08);
        osc.frequency.exponentialRampToValueAtTime(420, t0 + 0.32);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.08, t0 + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
        osc.connect(g).connect(master);
        osc.start(t0);
        osc.stop(t0 + 0.36);
      }

      // Intenta sonar en cuanto carga la página. Si el navegador bloquea el audio
      // automático, arranca con la primera interacción (clic, tecla o toque).
      function tryAutoplay() {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return; }
        const go = () => { if (ctx.state === "running") startMusic(); };
        ctx.resume().then(go, () => {});
        setTimeout(go, 300);
      }
      tryAutoplay();
      const firstGesture = () => {
        if (!playing && !userMuted) { if (ctx) ctx.resume(); startMusic(); }
        ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.removeEventListener(ev, firstGesture, true));
      };
      ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, firstGesture, true));

      button.addEventListener("click", () => {
        if (playing) { userMuted = true; stopMusic(); }
        else { userMuted = false; if (ctx) ctx.resume(); startMusic(); }
      });
    })();
  </script>
</body>
</html>
