<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a1a5e">
  <meta name="robots" content="noindex">
  <title>≽^•⩊•^≼</title>
  <link rel="icon" type="image/webp" href="gato.webp">
  <style>
    :root {
      --glass: rgba(30, 16, 74, 0.34);
      --ink: #1b1238;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      background: #2a1a5e;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.8s cubic-bezier(.6, -0.3, .3, 1.3);
    }

    /* ---------- Fondo ---------- */

    .rainbow {
      position: fixed;
      inset: -40px;
      background: repeating-linear-gradient(
        180deg,
        #ff4d6d 0 12%, #ff9f1c 12% 24%, #ffe14d 24% 36%,
        #5be37d 36% 48%, #4cc9f0 48% 60%, #7b61ff 60% 72%, #2a1a5e 72% 100%
      );
      background-size: 100% 140vh;
      filter: blur(14px) saturate(1.15);
      animation: flow 9s linear infinite;
      transform: skewY(-8deg);
      transition: filter 0.6s ease;
    }

    @keyframes flow {
      to { background-position: 0 140vh; }
    }

    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(3px 3px at 12% 18%, #fff 50%, transparent 51%),
        radial-gradient(3px 3px at 72% 28%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 35% 72%, #fff 50%, transparent 51%),
        radial-gradient(3px 3px at 88% 80%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 55% 12%, #fff 50%, transparent 51%),
        radial-gradient(2px 2px at 20% 88%, #fff 50%, transparent 51%);
      background-size: 420px 420px;
      animation: twinkle 1.6s steps(2) infinite, drift 18s linear infinite;
      opacity: 0.8;
    }

    @keyframes twinkle { 50% { opacity: 0.35; } }
    @keyframes drift { to { background-position: -420px 0; } }

    /* ---------- Filas de gatos ---------- */

    .row {
      position: fixed;
      left: 0;
      z-index: 3;
      width: 100%;
      height: 72px;
      background: url("gato-recorte.png") repeat-x;
      background-size: 46px 72px;
      animation: scroll 5s linear infinite;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    .row--top {
      top: 0;
      transform: rotate(180deg);
    }

    .row--bottom {
      bottom: 0;
    }

    @keyframes scroll {
      to { background-position: -460px 0; }
    }

    /* ---------- Capas ---------- */

    #flyers,
    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #flyers { z-index: 2; }
    #fx { z-index: 7; overflow: hidden; }

    .cat {
      position: absolute;
      width: calc(var(--s, 70px) * 0.628);
      height: var(--s, 70px);
      background: url("gato-recorte.png") center / contain no-repeat;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35));
    }

    /* ---------- Gatos voladores ---------- */

    .flyer {
      pointer-events: auto;
      cursor: pointer;
    }

    .flyer--float {
      animation: across var(--d, 12s) linear infinite, bob 1.2s ease-in-out infinite alternate;
    }

    @keyframes across {
      from { left: -140px; }
      to { left: calc(100% + 140px); }
    }

    @keyframes bob {
      from { translate: 0 -10px; rotate: -12deg; }
      to { translate: 0 10px; rotate: 12deg; }
    }

    .flyer--spin { animation: spin var(--d, 3s) linear infinite; }

    @keyframes spin { to { rotate: 360deg; } }

    .flyer--bounce { animation: bounce 0.9s cubic-bezier(.3, 0, .7, 1) infinite alternate; }

    @keyframes bounce {
      from { translate: 0 0; scale: 1 0.85; }
      to { translate: 0 -90px; scale: 0.95 1.05; }
    }

    .flyer.booped {
      animation: boop 0.6s ease-out forwards !important;
      pointer-events: none;
    }

    @keyframes boop {
      40% { scale: 1.6; rotate: 200deg; }
      100% { scale: 0; rotate: 720deg; opacity: 0; }
    }

    .pop {
      --s: 70px;
      margin: -35px 0 0 -22px;
      animation: pop 1.1s cubic-bezier(.2, .7, .3, 1) forwards;
    }

    @keyframes pop {
      0% { transform: scale(0.2) rotate(0); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(1.3) rotate(var(--r)); opacity: 0; }
    }

    .chaser {
      --s: 76px;
      position: fixed;
      z-index: 6;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    /* ---------- Efectos de las sorpresas ---------- */

    .rain {
      top: -160px;
      animation: fall var(--d, 2.4s) cubic-bezier(.45, 0, .8, 1) forwards;
    }

    @keyframes fall {
      to { transform: translateY(calc(100vh + 220px)) rotate(var(--r, 360deg)); }
    }

    .giant {
      --s: min(70vh, 620px);
      bottom: -6vh;
      left: -60vh;
      z-index: 8;
      animation: stomp 4.2s ease-in-out forwards;
    }

    @keyframes stomp {
      0% { left: -60vh; rotate: -6deg; }
      15% { rotate: 6deg; }
      30% { rotate: -6deg; }
      45% { left: calc(50% - 22vh); rotate: 0deg; scale: 1; }
      55% { left: calc(50% - 22vh); scale: 1.12; }
      65% { left: calc(50% - 22vh); scale: 1; }
      100% { left: calc(100% + 10vh); rotate: 6deg; }
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      animation: orbit var(--d, 3.6s) cubic-bezier(.3, 0, .6, 1) forwards;
    }

    .orbit .cat {
      left: var(--rad);
      top: -40px;
      --s: 80px;
    }

    @keyframes orbit {
      0% { rotate: var(--a); scale: 0.1; opacity: 0; }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { rotate: calc(var(--a) + 900deg); scale: 1.5; opacity: 0; }
    }

    .run {
      left: calc(100% + 60px);
      animation: run var(--d, 3s) linear forwards, bob 0.25s ease-in-out infinite alternate;
    }

    @keyframes run { to { left: -220px; } }

    .rise {
      bottom: -160px;
      animation: rise var(--d, 6s) ease-in forwards, bob 1.6s ease-in-out infinite alternate;
    }

    @keyframes rise { to { transform: translateY(calc(-100vh - 260px)); } }

    .yarn {
      position: absolute;
      top: -80px;
      width: var(--s, 54px);
      height: var(--s, 54px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), transparent 45%),
        repeating-linear-gradient(35deg, var(--c) 0 6px, rgba(0, 0, 0, 0.18) 6px 8px),
        var(--c);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.35);
      animation: yarn-drop 1.4s cubic-bezier(.5, 0, 1, .5) forwards, yarn-roll var(--d, 3s) 1.4s linear forwards;
    }

    @keyframes yarn-drop {
      0% { top: -80px; }
      70% { top: calc(100vh - 150px); }
      85% { top: calc(100vh - 230px); }
      100% { top: calc(100vh - 150px); }
    }

    @keyframes yarn-roll {
      to { translate: var(--x) 0; rotate: var(--r); opacity: 0; }
    }

    .laser {
      position: fixed;
      z-index: 9;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 20%, #ff1e3c 35% 60%, rgba(255, 30, 60, 0) 72%);
      box-shadow: 0 0 18px 8px rgba(255, 30, 60, 0.55);
      transition: left 0.55s cubic-bezier(.5, 0, .3, 1), top 0.55s cubic-bezier(.5, 0, .3, 1);
      pointer-events: auto;
      cursor: crosshair;
    }

    .laser::after {
      content: "";
      position: absolute;
      inset: -22px;
    }

    .laser-cat {
      --s: 90px;
      position: fixed;
      z-index: 8;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    .mouse {
      position: fixed;
      z-index: 9;
      left: 0;
      top: 0;
      font-size: 46px;
      line-height: 1;
      pointer-events: auto;
      cursor: crosshair;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.4));
    }

    .mouse::after {
      content: "";
      position: absolute;
      inset: -20px;
    }

    .kaomoji {
      position: absolute;
      color: #ffffff;
      font-size: var(--f, 22px);
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      animation: pop 1.6s cubic-bezier(.2, .7, .3, 1) forwards;
    }

    .combo {
      position: fixed;
      z-index: 9;
      margin: -40px 0 0 14px;
      color: #ffe14d;
      font-size: 26px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #ff4d6d, 0 4px 10px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      animation: combo 0.7s ease-out forwards;
    }

    @keyframes combo {
      from { transform: scale(0.6); opacity: 1; }
      to { transform: translateY(-40px) scale(1.2); opacity: 0; }
    }

    /* Modos de pantalla */
    body.party .rainbow { animation: flow 2s linear infinite, hue 0.8s linear infinite; }
    body.party .card { animation: dance 0.4s ease-in-out infinite alternate; }
    body.party .face { animation-duration: 0.25s; }

    @keyframes hue { to { filter: blur(14px) saturate(1.6) hue-rotate(360deg); } }
    @keyframes dance {
      from { rotate: -3deg; scale: 1; }
      to { rotate: 3deg; scale: 1.04; }
    }

    body.flip { transform: rotate(180deg); }

    body.ghost .rainbow { filter: blur(14px) brightness(0.22) saturate(0.3); }
    body.ghost .row { opacity: 0.35; }
    body.ghost #flyers { animation: flicker 0.4s steps(2) infinite; }
    body.ghost .cat { filter: drop-shadow(0 0 14px #c8b6ff) brightness(1.25) grayscale(0.6); }

    @keyframes flicker { 50% { opacity: 0.35; } }

    body.zerog .card { animation: zerog 3s ease-in-out infinite alternate; }
    body.zerog #flyers { animation: zerog 2.4s ease-in-out infinite alternate; }

    @keyframes zerog {
      from { translate: 0 0; rotate: -4deg; }
      to { translate: 0 -40px; rotate: 4deg; }
    }

    body.quake { animation: quake 0.12s linear infinite; }

    @keyframes quake {
      25% { translate: -8px 5px; }
      50% { translate: 7px -6px; }
      75% { translate: -5px -4px; }
    }

    body.squeak .face { animation: spin 0.35s linear infinite; }
    body.squeak .row { animation-duration: 1.5s; }

    body.legend .row { animation-duration: 1.2s; }
    body.legend .title h1 { animation: rainbow-text 0.6s linear infinite; }

    @keyframes rainbow-text {
      0% { color: #ff4d6d; }
      33% { color: #ffe14d; }
      66% { color: #4cc9f0; }
      100% { color: #ff4d6d; }
    }

    /* ---------- Tarjeta ---------- */

    .card {
      position: relative;
      z-index: 4;
      width: min(92vw, 640px);
      padding: 26px 28px 20px;
      border-radius: 18px;
      text-align: center;
      background: var(--glass);
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      cursor: default;
    }

    .card.shake { animation: shake 0.5s ease; }

    @keyframes shake {
      20% { translate: -10px 0; rotate: -2deg; }
      40% { translate: 10px 0; rotate: 2deg; }
      60% { translate: -6px 0; }
      80% { translate: 6px 0; }
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 20px);
      margin-bottom: 14px;
    }

    .title h1 {
      margin: 0;
      color: #ffffff;
      font-size: clamp(28px, 6vw, 46px);
      letter-spacing: -0.02em;
      text-shadow: 3px 3px 0 #ff4d6d, -3px -3px 0 #4cc9f0;
    }

    .face-wrap { position: relative; }

    .face {
      display: block;
      width: clamp(64px, 15vw, 112px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: url("gato.webp") center / cover;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
      animation: tilt 1.4s ease-in-out infinite alternate;
    }

    .face-wrap:last-child .face { animation-direction: alternate-reverse; }

    .crown {
      position: absolute;
      left: 50%;
      top: -30px;
      font-size: 34px;
      transform: translateX(-50%) rotate(-10deg);
      animation: tilt 1s ease-in-out infinite alternate;
    }

    @keyframes tilt {
      from { rotate: -10deg; scale: 1; }
      to { rotate: 10deg; scale: 1.08; }
    }

    .card p {
      margin: 8px 0;
      color: #ffffff;
      font-size: clamp(15px, 2.4vw, 18px);
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    }

    .score {
      display: grid;
      gap: 8px;
      justify-items: center;
      margin: 14px 0 4px;
    }

    .counter {
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.28);
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .counter.bump { animation: bump 0.25s ease; }

    @keyframes bump { 50% { scale: 1.18; } }

    .next {
      width: min(320px, 80%);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.25);
    }

    .next span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffe14d, #ff4d6d);
      transition: width 0.25s ease;
    }

    .hint,
    .stats {
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      font-weight: 600;
    }

    .stats {
      margin-top: 2px;
    }

    details.logros {
      max-width: 420px;
      margin: 8px auto 0;
      color: #ffffff;
      font-size: 13px;
      text-align: left;
      cursor: default;
    }

    details.logros summary {
      text-align: center;
      font-weight: 700;
      cursor: pointer;
    }

    details.logros ul {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 12px;
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      list-style: none;
    }

    details.logros li.off { opacity: 0.55; }

    .back {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    }

    .back:active {
      translate: 0 2px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    :focus-visible {
      outline: 3px solid #ffe14d;
      outline-offset: 3px;
    }

    /* ---------- Letreros y logros ---------- */

    .banner {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 9vh;
      padding: 10px 26px;
      border-radius: 16px;
      background: #ffe14d;
      color: #1b1238;
      font-size: clamp(24px, 5.6vw, 52px);
      font-weight: 900;
      letter-spacing: -0.02em;
      white-space: nowrap;
      box-shadow: 0 8px 0 #c9a400, 0 18px 40px rgba(0, 0, 0, 0.35);
      transform: translateX(-50%);
      pointer-events: none;
      animation: banner 2.6s cubic-bezier(.2, .9, .3, 1.3) forwards;
    }

    .banner small {
      display: block;
      font-size: 0.38em;
      font-weight: 700;
      text-align: center;
    }

    @keyframes banner {
      0% { transform: translateX(-50%) scale(0) rotate(-12deg); }
      15% { transform: translateX(-50%) scale(1.1) rotate(3deg); }
      25% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      85% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
      100% { transform: translateX(-50%) scale(0.6) translateY(-40px); opacity: 0; }
    }

    .toasts {
      position: fixed;
      z-index: 11;
      right: 14px;
      bottom: 86px;
      display: grid;
      gap: 8px;
      justify-items: end;
      pointer-events: none;
    }

    .toast {
      padding: 10px 14px;
      border-radius: 12px;
      background: #1b1238;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 0 0 2px #ffe14d;
      animation: toast 3.2s ease forwards;
    }

    .toast small {
      display: block;
      color: #ffe14d;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    @keyframes toast {
      0% { transform: translateX(120%); }
      10%, 85% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(0); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
      .flyer, .chaser { display: none; }
      body.flip { transform: none; }
    }

    @media (pointer: coarse) {
      .chaser { display: none; }
    }
  </style>
</head>
<body>
  <div class="rainbow" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="row row--top" aria-hidden="true"></div>
  <div class="row row--bottom" aria-hidden="true"></div>
  <div id="flyers" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>
  <span class="cat chaser" id="chaser" aria-hidden="true"></span>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <main class="card" id="card">
    <div class="title">
      <span class="face-wrap"><span class="face" role="img" aria-label="Gato mirando fijamente"></span></span>
      <h1 id="title">¡miau!</h1>
      <span class="face-wrap"><span class="face" role="img" aria-label="Gato mirando fijamente"></span></span>
    </div>
    <p>encontraste el easter egg, curioso humano.</p>
    <p>toca en cualquier parte para soltar gatitos, o atrapa a los que vuelan ≽^•⩊•^≼</p>
    <div class="score">
      <span class="counter" id="counter" aria-live="polite"><span id="count">0</span> gatos liberados</span>
      <div class="next" aria-hidden="true"><span id="bar"></span></div>
      <span class="hint" id="hint">la próxima sorpresa se acerca…</span>
      <span class="stats" id="stats"></span>
    </div>
    <details class="logros" id="logros">
      <summary>🏆 Logros</summary>
      <ul id="logros-list"></ul>
    </details>
    <a class="back" href="../../">Volver al portafolio</a>
  </main>

  <script>
    (function () {
      "use strict";

      /*
       * ¿Quieres usar una canción propia? Pon el archivo (mp3/ogg) en esta carpeta
       * y escribe su nombre aquí, por ejemplo "musica.mp3". Si se deja vacío, suena
       * la melodía chiptune que genera el navegador.
       */
      const MUSIC_FILE = "";

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const rand = (a, b) => a + Math.random() * (b - a);
      const randInt = (a, b) => Math.floor(rand(a, b + 1));
      const pick = (list) => list[Math.floor(Math.random() * list.length)];
      const fx = document.getElementById("fx");
      const card = document.getElementById("card");
      const store = {
        get(key, fallback) { try { const v = localStorage.getItem("miau:" + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
        set(key, value) { try { localStorage.setItem("miau:" + key, JSON.stringify(value)); } catch (e) { /* sin almacenamiento */ } }
      };

      // Título de la pestaña que va cambiando
      const titles = ["≽^•⩊•^≼", "(˵◝ ⩊ ◜˵)マ", "/ᐠ > ˕ <マ ₊˚⊹♡", "ฅ^•ﻌ•^ฅ"];
      let t = 0;
      setInterval(() => { document.title = titles[t++ % titles.length]; }, 500);

      /* ================= Logros ================= */

      const ACHIEVEMENTS = [
        ["primero", "Primer gatito", "libera tu primer gato"],
        ["atrapa", "Atrapagatos", "atrapa un gato volador"],
        ["experto", "Cazador experto", "atrapa 10 gatos voladores"],
        ["combo", "Dedos veloces", "llega a un combo x8"],
        ["miau", "Hablas gato", "escribe una palabra secreta"],
        ["laser", "Más rápido que la luz", "atrapa el punto láser"],
        ["raton", "Cazador de ratones", "atrapa al ratón"],
        ["paciencia", "Paciencia gatuna", "quédate un minuto"],
        ["cien", "Leyenda", "libera 100 gatos"],
        ["rey", "Realeza felina", "libera 250 gatos"],
        ["sorpresas", "Coleccionista", "ve 8 sorpresas distintas"],
        ["record", "Nuevo récord", "supera tu mejor marca"]
      ];
      const unlocked = new Set(store.get("logros", []));
      const best = store.get("best", 0);
      const toasts = document.getElementById("toasts");

      function renderAchievements() {
        document.getElementById("logros-list").innerHTML = ACHIEVEMENTS.map(([id, name, desc]) =>
          `<li class="${unlocked.has(id) ? "" : "off"}" title="${desc}">${unlocked.has(id) ? "✓" : "🔒"} ${name}</li>`).join("");
        document.querySelector("#logros summary").textContent = `🏆 Logros ${unlocked.size}/${ACHIEVEMENTS.length}`;
      }

      function unlock(id) {
        if (unlocked.has(id)) return;
        unlocked.add(id);
        store.set("logros", [...unlocked]);
        const a = ACHIEVEMENTS.find((x) => x[0] === id);
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `<small>Logro desbloqueado</small>${a[1]}`;
        toasts.appendChild(el);
        setTimeout(() => el.remove(), 3300);
        chime();
        renderAchievements();
      }

      setTimeout(() => unlock("paciencia"), 60000);

      /* ================= Gatos voladores ================= */

      const layer = document.getElementById("flyers");
      let boops = 0;

      function spawnFlyer(kind, x, y) {
        const el = document.createElement("span");
        el.className = "cat flyer flyer--" + kind;
        if (kind === "float") {
          el.style.setProperty("--s", rand(80, 140) + "px");
          el.style.setProperty("--d", rand(8, 16) + "s");
          el.style.top = rand(12, 78) + "%";
          el.style.animationDelay = -rand(0, 16) + "s, " + -rand(0, 1) + "s";
        } else {
          el.style.setProperty("--s", rand(90, 130) + "px");
          el.style.setProperty("--d", rand(2, 4) + "s");
          el.style.left = x + "%";
          el.style.top = y + "%";
        }
        layer.appendChild(el);
        return el;
      }

      if (!reduce) {
        for (let i = 0; i < 7; i++) spawnFlyer("float");
        [[6, 22, "bounce"], [86, 18, "spin"], [10, 70, "bounce"], [84, 66, "spin"]].forEach(([x, y, k]) => spawnFlyer(k, x, y));
      }

      // Atrapar un gato volador: explota en gatitos y suma 5
      layer.addEventListener("pointerdown", (e) => {
        const cat = e.target.closest(".flyer");
        if (!cat || cat.classList.contains("booped")) return;
        e.stopPropagation();
        startMusic();
        cat.classList.add("booped");
        boing();
        for (let i = 0; i < 5; i++) popAt(e.clientX, e.clientY);
        boops++;
        unlock("atrapa");
        if (boops >= 10) unlock("experto");
        release(5);
        setTimeout(() => {
          const kind = cat.classList.contains("flyer--float") ? "float" : cat.classList.contains("flyer--spin") ? "spin" : "bounce";
          const x = parseFloat(cat.style.left) || rand(5, 90);
          const y = parseFloat(cat.style.top) || rand(15, 75);
          cat.remove();
          spawnFlyer(kind, x, y);
        }, 700);
      });

      /* ================= Contador, combos y clics ================= */

      const countEl = document.getElementById("count");
      const counter = document.getElementById("counter");
      const bar = document.getElementById("bar");
      const hint = document.getElementById("hint");
      const stats = document.getElementById("stats");
      let released = 0;
      let segmentStart = 0;
      let nextSurprise = randInt(20, 42);
      let combo = 0;
      let lastClick = 0;
      let recordBeaten = false;

      function updateStats() {
        const record = Math.max(best, released);
        stats.textContent = `récord: ${record} gatos`;
      }

      function popAt(x, y) {
        if (reduce) return;
        const pop = document.createElement("span");
        pop.className = "cat pop";
        pop.style.left = x + "px";
        pop.style.top = y + "px";
        pop.style.setProperty("--x", rand(-220, 220) + "px");
        pop.style.setProperty("--y", rand(-260, -80) + "px");
        pop.style.setProperty("--r", rand(-540, 540) + "deg");
        fx.appendChild(pop);
        pop.addEventListener("animationend", () => pop.remove());
      }

      function release(n) {
        const before = released;
        released += n;
        countEl.textContent = released;
        counter.classList.remove("bump");
        void counter.offsetWidth;
        counter.classList.add("bump");
        unlock("primero");

        if (released > best) {
          store.set("best", released);
          if (best > 0 && !recordBeaten) { recordBeaten = true; unlock("record"); }
        }
        updateStats();

        // Hitos fijos que se celebran a lo grande
        const big = [500, 250, 100].find((m) => before < m && released >= m);
        if (big) {
          bigEvent(big);
          segmentStart = released;
          nextSurprise = released + randInt(20, 42);
        } else if (released >= nextSurprise) {
          surprise();
          segmentStart = released;
          nextSurprise = released + randInt(20, 42);
        }

        const span = nextSurprise - segmentStart;
        const done = released - segmentStart;
        bar.style.width = Math.min(100, (done / span) * 100) + "%";
        const left = nextSurprise - released;
        hint.textContent = left <= 5 ? "¡la sorpresa está a punto de llegar!" : left <= 15 ? "algo se acerca…" : "sigue soltando gatos…";
      }

      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".back, details, .laser, .mouse")) return;
        startMusic();
        const now = performance.now();
        combo = now - lastClick < 450 ? Math.min(combo + 1, 12) : 1;
        lastClick = now;
        const amount = combo >= 10 ? 3 : combo >= 6 ? 2 : 1;
        for (let i = 0; i < amount; i++) popAt(e.clientX, e.clientY);
        if (combo >= 3) showCombo(e.clientX, e.clientY);
        if (combo >= 8) unlock("combo");
        meow();
        release(amount);
      });

      function showCombo(x, y) {
        const el = document.createElement("span");
        el.className = "combo";
        el.textContent = "x" + combo + (combo >= 10 ? "!!" : combo >= 6 ? "!" : "");
        el.style.left = x + "px";
        el.style.top = y + "px";
        document.body.appendChild(el);
        el.addEventListener("animationend", () => el.remove());
      }

      /* ================= Sorpresas ================= */

      function banner(text, sub) {
        document.querySelectorAll(".banner").forEach((b) => b.remove());
        const el = document.createElement("div");
        el.className = "banner";
        el.innerHTML = `${text}<small>${sub}</small>`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2700);
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
      }

      const modeTimers = {};
      function mode(cls, ms, onEnd) {
        document.body.classList.add(cls);
        clearTimeout(modeTimers[cls]);
        modeTimers[cls] = setTimeout(() => { document.body.classList.remove(cls); if (onEnd) onEnd(); }, ms);
      }

      function add(el, life) {
        fx.appendChild(el);
        el.addEventListener("animationend", (ev) => { if (ev.target === el && (!life || ev.animationName === life)) el.remove(); });
        return el;
      }

      function catRain(amount = 30) {
        if (reduce) return;
        for (let i = 0; i < amount; i++) {
          setTimeout(() => {
            const c = document.createElement("span");
            c.className = "cat rain";
            c.style.left = rand(-2, 98) + "%";
            c.style.setProperty("--s", rand(60, 130) + "px");
            c.style.setProperty("--d", rand(1.8, 3.2) + "s");
            c.style.setProperty("--r", rand(-540, 540) + "deg");
            add(c);
          }, i * 70);
        }
      }

      function giantCat() {
        if (reduce) return;
        const g = document.createElement("span");
        g.className = "cat giant";
        add(g);
        [600, 1900, 3200].forEach((ms) => setTimeout(() => meow(0.5), ms));
      }

      function tornado() {
        if (reduce) return;
        for (let i = 0; i < 18; i++) {
          const o = document.createElement("span");
          o.className = "orbit";
          o.style.setProperty("--a", i * 20 + "deg");
          o.style.setProperty("--rad", rand(80, 320) + "px");
          o.style.setProperty("--d", rand(3, 4.2) + "s");
          o.innerHTML = '<span class="cat"></span>';
          add(o, "orbit");
        }
        sweep(120, 900, 2.5, "sawtooth", 0.05);
      }

      function stampede() {
        if (reduce) return;
        for (let i = 0; i < 22; i++) {
          setTimeout(() => {
            const c = document.createElement("span");
            c.className = "cat run";
            c.style.top = rand(55, 82) + "%";
            c.style.setProperty("--s", rand(70, 120) + "px");
            c.style.setProperty("--d", rand(1.6, 2.8) + "s");
            add(c, "run");
          }, i * 110);
        }
      }

      function zeroG() {
        mode("zerog", 7000);
        if (reduce) return;
        for (let i = 0; i < 16; i++) {
          setTimeout(() => {
            const c = document.createElement("span");
            c.className = "cat rise";
            c.style.left = rand(0, 95) + "%";
            c.style.setProperty("--s", rand(60, 110) + "px");
            c.style.setProperty("--d", rand(4, 7) + "s");
            add(c, "rise");
          }, i * 250);
        }
      }

      function yarnStorm() {
        if (reduce) return;
        const colors = ["#ff4d6d", "#4cc9f0", "#ffe14d", "#7b61ff", "#5be37d"];
        for (let i = 0; i < 14; i++) {
          setTimeout(() => {
            const y = document.createElement("span");
            y.className = "yarn";
            y.style.left = rand(3, 92) + "%";
            y.style.setProperty("--c", pick(colors));
            y.style.setProperty("--s", rand(40, 70) + "px");
            y.style.setProperty("--x", rand(-500, 500) + "px");
            y.style.setProperty("--r", rand(-900, 900) + "deg");
            y.style.setProperty("--d", rand(2, 3.5) + "s");
            add(y, "yarn-roll");
            setTimeout(() => boing(0.4), 1000);
          }, i * 160);
        }
      }

      function kaomojiBurst() {
        if (reduce) return;
        const faces = ["≽^•⩊•^≼", "ฅ^•ﻌ•^ฅ", "(=^･ω･^=)", "/ᐠ｡ꞈ｡ᐟ\\", "ᓚᘏᗢ", "(^._.^)ﾉ", "=^..^="];
        for (let i = 0; i < 26; i++) {
          const k = document.createElement("span");
          k.className = "kaomoji";
          k.textContent = pick(faces);
          k.style.left = rand(5, 90) + "%";
          k.style.top = rand(25, 85) + "%";
          k.style.setProperty("--f", rand(18, 38) + "px");
          k.style.setProperty("--x", rand(-120, 120) + "px");
          k.style.setProperty("--y", rand(-220, -60) + "px");
          k.style.setProperty("--r", rand(-40, 40) + "deg");
          k.style.animationDelay = rand(0, 0.8) + "s";
          add(k);
        }
      }

      function laserGame() {
        const dot = document.createElement("span");
        dot.className = "laser";
        document.body.appendChild(dot);
        const chasers = [];
        for (let i = 0; i < 4 && !reduce; i++) {
          const c = document.createElement("span");
          c.className = "cat laser-cat";
          c._x = rand(0, innerWidth); c._y = innerHeight;
          document.body.appendChild(c);
          chasers.push(c);
        }
        let alive = true;
        const move = () => { dot.style.left = rand(8, 92) + "%"; dot.style.top = rand(15, 82) + "%"; };
        move();
        const mover = setInterval(move, 650);
        (function follow() {
          if (!alive) return;
          const r = dot.getBoundingClientRect();
          chasers.forEach((c, i) => {
            const speed = 0.04 + i * 0.012;
            c._x += (r.left - 30 - c._x) * speed;
            c._y += (r.top - 60 - c._y) * speed;
            c.style.transform = `translate(${c._x}px, ${c._y}px) rotate(${(r.left - c._x) * 0.05}deg)`;
          });
          requestAnimationFrame(follow);
        })();
        const end = (caught) => {
          if (!alive) return;
          alive = false;
          clearInterval(mover);
          dot.remove();
          chasers.forEach((c) => c.remove());
          if (caught) { banner("¡LÁSER ATRAPADO!", "+15 gatos"); unlock("laser"); release(15); }
        };
        dot.addEventListener("pointerdown", (e) => { e.stopPropagation(); pew(); end(true); });
        setTimeout(() => end(false), 8000);
      }

      function mouseHunt() {
        const m = document.createElement("span");
        m.className = "mouse";
        m.textContent = "🐭";
        document.body.appendChild(m);
        const fromLeft = Math.random() < 0.5;
        const start = performance.now();
        const dur = 5200;
        const baseY = rand(25, 70);
        let alive = true;
        (function run(now) {
          if (!alive) return;
          const p = (now - start) / dur;
          if (p >= 1) { alive = false; m.remove(); return; }
          const x = fromLeft ? -60 + p * (innerWidth + 120) : innerWidth + 60 - p * (innerWidth + 120);
          const y = (baseY / 100) * innerHeight + Math.sin(p * Math.PI * 6) * 90;
          m.style.transform = `translate(${x}px, ${y}px) scaleX(${fromLeft ? -1 : 1})`;
          requestAnimationFrame(run);
        })(start);
        m.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          if (!alive) return;
          alive = false;
          m.remove();
          squeak();
          banner("¡RATÓN CAZADO!", "+20 gatos");
          unlock("raton");
          release(20);
        });
      }

      // Catálogo de sorpresas aleatorias
      const SURPRISES = {
        lluvia: { title: "¡LLUVIA DE GATOS!", sub: "llévate un paraguas", run: () => catRain() },
        gigante: { title: "¡GATO GIGANTE!", sub: "cuidado con las patitas", run: giantCat },
        fiesta: { title: "¡FIESTA GATUNA!", sub: "que nadie pare la música", run: () => { party(8000); catRain(20); } },
        tornado: { title: "¡TORNADO GATUNO!", sub: "agárrate fuerte", run: tornado },
        estampida: { title: "¡ESTAMPIDA!", sub: "llegó la hora de la cena", run: stampede },
        gravedad: { title: "¡GRAVEDAD CERO!", sub: "los gatos flotan", run: zeroG },
        reves: { title: "¡MUNDO AL REVÉS!", sub: "los gatos siempre caen de pie", run: () => mode("flip", 4000) },
        fantasma: { title: "¡HORA FANTASMA!", sub: "miauuu… uuu…", run: () => { mode("ghost", 6500); ghostSound(); } },
        estambre: { title: "¡LLUVIA DE ESTAMBRE!", sub: "a jugar", run: yarnStorm },
        ardilla: { title: "¡MODO ARDILLA!", sub: "todo más rápido", run: () => { mode("squeak", 8000, () => { transpose = 0; tempo = BASE_TEMPO; }); transpose = 12; tempo = 0.085; } },
        laser: { title: "¡PUNTO LÁSER!", sub: "atrápalo antes que los gatos", run: laserGame },
        raton: { title: "¡UN RATÓN!", sub: "atrápalo, rápido", run: mouseHunt },
        terremoto: { title: "¡TERREMOTO GATUNO!", sub: "se cayeron de las barras", run: () => { mode("quake", 2200); catRain(18); rumble(); } },
        caritas: { title: "¡LLUVIA DE CARITAS!", sub: "(=^･ω･^=)", run: kaomojiBurst }
      };
      const seen = new Set();
      let lastSurprise = "";

      function party(ms) {
        mode("party", ms, () => { tempo = BASE_TEMPO; });
        tempo = 0.095;
      }

      function surprise(name) {
        const keys = Object.keys(SURPRISES).filter((k) => k !== lastSurprise);
        const key = name || pick(keys);
        lastSurprise = key;
        const s = SURPRISES[key];
        fanfare();
        banner(s.title, s.sub);
        s.run();
        seen.add(key);
        if (seen.size >= 8) unlock("sorpresas");
      }

      function bigEvent(m) {
        fanfare();
        if (m === 100) {
          banner("¡LEYENDA GATUNA!", "100 gatos y contando");
          document.getElementById("title").textContent = "¡MIAUUU!";
          document.body.classList.add("legend");
          unlock("cien");
          party(12000); catRain(60); setTimeout(giantCat, 1200);
        } else if (m === 250) {
          banner("¡REALEZA FELINA!", "250 gatos te declaran su rey");
          document.querySelectorAll(".face-wrap").forEach((w) => { if (!w.querySelector(".crown")) w.insertAdjacentHTML("beforeend", '<span class="crown" aria-hidden="true">👑</span>'); });
          unlock("rey");
          tornado(); setTimeout(kaomojiBurst, 800); party(10000);
        } else {
          banner("¡GATO HONORARIO!", "500 gatos… ¿estás bien?");
          document.getElementById("title").textContent = "¡GATO HONORARIO!";
          party(15000); catRain(80); setTimeout(tornado, 1000); setTimeout(stampede, 2500); setTimeout(giantCat, 4000);
        }
      }

      // Palabras secretas escritas con el teclado
      const WORDS = { miau: "fiesta", gato: "gigante", lluvia: "lluvia", raton: "raton", laser: "laser", fantasma: "fantasma" };
      let typed = "";
      document.addEventListener("keydown", (e) => {
        if (e.key.length !== 1) return;
        typed = (typed + e.key.toLowerCase()).slice(-10);
        for (const [word, key] of Object.entries(WORDS)) {
          if (typed.endsWith(word)) { typed = ""; unlock("miau"); surprise(key); break; }
        }
      });

      /* ================= Gato que sigue el cursor ================= */

      const chaser = document.getElementById("chaser");
      let mx = innerWidth / 2;
      let my = innerHeight / 2;
      let cx = mx;
      let cy = my;
      document.addEventListener("pointermove", (e) => { mx = e.clientX; my = e.clientY; });
      (function follow() {
        cx += (mx + 26 - cx) * 0.08;
        cy += (my + 10 - cy) * 0.08;
        chaser.style.transform = `translate(${cx}px, ${cy}px) rotate(${(mx - cx) * 0.15}deg)`;
        requestAnimationFrame(follow);
      })();

      /* ================= Sonido ================= */

      let ctx = null;
      let master = null;
      let playing = false;
      let muted = false;
      let fileAudio = null;
      const BASE_TEMPO = 0.13;
      let tempo = BASE_TEMPO;
      let transpose = 0;
      let step = 0;
      let nextTime = 0;
      const N = (n) => 440 * Math.pow(2, (n + transpose - 69) / 12);
      const melody = [72, 76, 79, 76, 81, 79, 76, 74, 72, 76, 79, 84, 83, 81, 79, 0,
                      77, 81, 84, 81, 79, 76, 74, 76, 72, 74, 76, 79, 77, 74, 72, 0];
      const bass = [48, 60, 48, 60, 45, 57, 45, 57, 41, 53, 41, 53, 43, 55, 43, 55];

      function audio() {
        if (ctx) return ctx;
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain();
          master.gain.value = 0.55;
          master.connect(ctx.destination);
        } catch (e) { ctx = null; }
        return ctx;
      }

      const ready = () => ctx && ctx.state === "running" && !muted;

      function tone(freq, start, dur, type, gain) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(gain, start);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(g).connect(master);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      }

      function sweep(f1, f2, dur, type, gain, f3) {
        if (!ready()) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        const t0 = ctx.currentTime;
        osc.type = type;
        osc.frequency.setValueAtTime(f1, t0);
        if (f3) {
          osc.frequency.linearRampToValueAtTime(f2, t0 + dur * 0.25);
          osc.frequency.exponentialRampToValueAtTime(f3, t0 + dur);
        } else {
          osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
        }
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gain, t0 + Math.min(0.04, dur / 4));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }

      function scheduler() {
        if (!playing || MUSIC_FILE || !ctx) return;
        while (nextTime < ctx.currentTime + 0.15) {
          const note = melody[step % melody.length];
          if (note) tone(N(note), nextTime, tempo * 0.85, "square", 0.06);
          if (step % 2 === 0) tone(N(bass[(step / 2) % bass.length]), nextTime, tempo * 1.8, "triangle", 0.15);
          if (step % 2 === 1) tone(N(98), nextTime, 0.03, "square", 0.012);
          nextTime += tempo;
          step++;
        }
      }
      setInterval(scheduler, 25);

      function startMusic() {
        if (playing || muted) return;
        if (MUSIC_FILE) {
          fileAudio = fileAudio || Object.assign(new Audio(MUSIC_FILE), { loop: true, volume: 0.6 });
          fileAudio.play().then(() => { playing = true; }, () => {});
          if (audio()) ctx.resume();
          return;
        }
        if (!audio()) return;
        ctx.resume();
        if (ctx.state !== "running") return;
        playing = true;
        nextTime = ctx.currentTime + 0.05;
      }

      function stopMusic() {
        playing = false;
        if (fileAudio) fileAudio.pause();
      }

      function fanfare() {
        if (!ready()) return;
        const t0 = ctx.currentTime;
        [72, 76, 79, 84, 79, 84].forEach((n, i) => tone(N(n), t0 + i * 0.08, 0.18, "square", 0.08));
      }

      function chime() {
        if (!ready()) return;
        const t0 = ctx.currentTime;
        [88, 91, 96].forEach((n, i) => tone(N(n), t0 + i * 0.06, 0.25, "triangle", 0.08));
      }

      const meow = (volume = 1) => { const b = rand(600, 820); sweep(b, b * 1.6, 0.34, "sawtooth", 0.07 * volume, b * 0.6); };
      const boing = (volume = 1) => sweep(180, 900, 0.4, "sine", 0.2 * volume, 260);
      const pew = () => sweep(1800, 200, 0.25, "square", 0.08);
      const squeak = () => { sweep(2200, 3200, 0.08, "square", 0.05); setTimeout(() => sweep(2400, 3400, 0.08, "square", 0.05), 110); };
      const rumble = () => sweep(70, 40, 2, "sawtooth", 0.12);
      const ghostSound = () => sweep(400, 520, 2.4, "sine", 0.09, 260);

      // La música intenta sonar en cuanto carga la página. Si el navegador
      // bloquea el audio automático, empieza con el primer clic, tecla o toque.
      startMusic();
      if (ctx && !MUSIC_FILE) ctx.resume().then(() => startMusic(), () => {});
      ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, () => startMusic(), { capture: true }));

      // Tecla M sola (no como parte de una palabra secreta): silenciar o reactivar
      let mTimer = null;
      document.addEventListener("keydown", (e) => {
        clearTimeout(mTimer);
        if (e.key.toLowerCase() !== "m") return;
        mTimer = setTimeout(() => {
          muted = !muted;
          if (muted) stopMusic(); else startMusic();
        }, 700);
      });

      renderAchievements();
      updateStats();
    })();
  </script>
</body>
</html>
