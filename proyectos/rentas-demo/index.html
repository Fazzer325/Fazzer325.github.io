<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#173d30">
    <meta name="description" content="Demo interactiva de Gestión de Rentas: propiedades, inquilinos y cobros con datos de ejemplo guardados en el navegador.">
    <title>Gestión de Rentas · Demo</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2320523f'/%3E%3Cpath d='m5 11.5 7-6 7 6M7 10.5V18h10v-7.5M10.5 18v-4h3v4' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="demo-bar" role="note">
        <span><strong>Modo demo.</strong> Los datos son de ejemplo y se guardan solo en tu navegador.</span>
        <button type="button" data-reset-demo>Restablecer demo</button>
        <a href="../../#proyectos">Volver al portafolio</a>
    </div>
    <div id="app"></div>
    <dialog id="app-confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-dialog-title">
        <div class="confirm-dialog__box">
            <h2 id="confirm-dialog-title" class="confirm-dialog__title">Confirmar acción</h2>
            <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
            <div class="confirm-dialog__actions">
                <button type="button" class="button button--secondary" data-dialog-cancel>Cancelar</button>
                <button type="button" class="button button--danger" data-dialog-confirm>Confirmar</button>
            </div>
        </div>
    </dialog>
    <script src="app.js"></script>
</body>
</html>
